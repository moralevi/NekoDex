name: Refresh unlock dataset

# Weekly after the Tuesday reset, and on demand. Runs DataGen against the FFXIV Collect API only (CI has no game files),
# and opens a pull request when unlocks.json changed. The next local run re-validates against the game sheets.

on:
  schedule:
    - cron: '0 10 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Regenerate dataset (API only)
        shell: pwsh
        run: |
          dotnet run --project tools/DataGen -- --no-game 2>&1 | Tee-Object -FilePath datagen.log
          "## DataGen output" | Out-File -FilePath pr-body.md -Encoding utf8
          '```' | Out-File -FilePath pr-body.md -Append -Encoding utf8
          Get-Content datagen.log | Out-File -FilePath pr-body.md -Append -Encoding utf8
          '```' | Out-File -FilePath pr-body.md -Append -Encoding utf8
          "Generated without game files: sheet validation was skipped and the max entry id comes from the API. Run DataGen locally before merging if a patch landed." | Out-File -FilePath pr-body.md -Append -Encoding utf8

      - name: Open pull request if changed
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: src/NekoDex/Data/unlocks.json
          commit-message: "Data: refresh unlock dataset"
          branch: data/refresh-unlocks
          title: "Data: refresh unlock dataset"
          body-path: pr-body.md
          delete-branch: true
